name: Publish figctx

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./packages/cli/package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack release artifact
        run: |
          mkdir release
          pnpm --filter figctx pack --pack-destination "$PWD/release"
          find release -name '*.tgz' -print -quit | grep .
          sha256sum release/*.tgz > release/figctx.sha256
      - name: Check whether this version is already on npm
        id: npm-version
        run: |
          package_name=$(node -p "require('./packages/cli/package.json').name")
          package_version=$(node -p "require('./packages/cli/package.json').version")
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with trusted publishing
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish release/*.tgz --access public
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.tgz release/figctx.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" release/*.tgz release/figctx.sha256 --generate-notes
          fi
